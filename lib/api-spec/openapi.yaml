openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Minecraft Hosting Panel API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: servers
    description: Minecraft server management
  - name: users
    description: User management
  - name: nodes
    description: Node/daemon management
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username/email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/profile:
    patch:
      operationId: updateProfile
      tags: [auth]
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /servers:
    get:
      operationId: listServers
      tags: [servers]
      summary: List all servers
      responses:
        "200":
          description: List of servers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Server"
    post:
      operationId: createServer
      tags: [servers]
      summary: Create a new server
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateServerRequest"
      responses:
        "201":
          description: Server created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"

  /servers/{id}:
    get:
      operationId: getServer
      tags: [servers]
      summary: Get a server by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"
        "404":
          description: Server not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteServer
      tags: [servers]
      summary: Delete a server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /servers/{id}/power:
    post:
      operationId: serverPowerAction
      tags: [servers]
      summary: Start, stop, or restart a server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerActionRequest"
      responses:
        "200":
          description: Action performed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /servers/{id}/command:
    post:
      operationId: sendServerCommand
      tags: [servers]
      summary: Send a command to the server console
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          description: Command sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /servers/{id}/stats:
    get:
      operationId: getServerStats
      tags: [servers]
      summary: Get server resource stats
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Server stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerStats"

  /servers/{id}/logs:
    get:
      operationId: getServerLogs
      tags: [servers]
      summary: Get recent console logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: lines
          in: query
          schema:
            type: number
      responses:
        "200":
          description: Console logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /nodes:
    get:
      operationId: listNodes
      tags: [nodes]
      summary: List all nodes
      responses:
        "200":
          description: List of nodes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
    post:
      operationId: createNode
      tags: [nodes]
      summary: Create a new node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNodeRequest"
      responses:
        "201":
          description: Node created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"

  /nodes/{id}:
    get:
      operationId: getNode
      tags: [nodes]
      summary: Get a node by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
    delete:
      operationId: deleteNode
      tags: [nodes]
      summary: Delete a node
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Node deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /servers/{id}/update:
    patch:
      operationId: updateServer
      tags: [servers]
      summary: Update server settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateServerRequest"
      responses:
        "200":
          description: Server updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Server"

  /servers/{id}/files:
    get:
      operationId: listServerFiles
      tags: [servers]
      summary: List files in a directory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Directory listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileListResponse"
    delete:
      operationId: deleteServerFile
      tags: [servers]
      summary: Delete a file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /servers/{id}/files/read:
    get:
      operationId: readServerFile
      tags: [servers]
      summary: Read file contents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileReadResponse"

  /servers/{id}/files/write:
    put:
      operationId: writeServerFile
      tags: [servers]
      summary: Write file contents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: query
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileWriteRequest"
      responses:
        "200":
          description: File saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /servers/{id}/files/mkdir:
    post:
      operationId: createServerDirectory
      tags: [servers]
      summary: Create a directory
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                path:
                  type: string
              required:
                - path
      responses:
        "200":
          description: Directory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"

  /servers/{id}/files/touch:
    post:
      operationId: createServerFile
      tags: [servers]
      summary: Create a new empty file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FilePathRequest"
      responses:
        "200":
          description: File created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"

  /servers/{id}/files/rename:
    post:
      operationId: renameServerFile
      tags: [servers]
      summary: Rename a file or folder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileRenameRequest"
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers/{id}/files/move:
    post:
      operationId: moveServerFile
      tags: [servers]
      summary: Move a file or folder to a new path
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileTransferRequest"
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers/{id}/files/copy:
    post:
      operationId: copyServerFile
      tags: [servers]
      summary: Copy a file or folder to a new path
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileTransferRequest"
      responses:
        "200":
          description: Copied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers/{id}/files/compress:
    post:
      operationId: compressServerFile
      tags: [servers]
      summary: Compress a file or folder into a zip archive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileCompressRequest"
      responses:
        "200":
          description: Compressed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404":
          description: Source not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers/{id}/files/extract:
    post:
      operationId: extractServerFile
      tags: [servers]
      summary: Extract a zip file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileExtractRequest"
      responses:
        "200":
          description: Extracted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileEntry"
        "404":
          description: Zip not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /servers/{id}/plugins:
    get:
      operationId: listServerPlugins
      tags: [servers]
      summary: List installed plugins
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServerPlugin"
    post:
      operationId: installServerPlugin
      tags: [servers]
      summary: Install a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallPluginRequest"
      responses:
        "201":
          description: Plugin installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerPlugin"

  /servers/{id}/plugins/{pluginId}:
    patch:
      operationId: toggleServerPlugin
      tags: [servers]
      summary: Enable or disable a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
      responses:
        "200":
          description: Plugin updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerPlugin"
    delete:
      operationId: removeServerPlugin
      tags: [servers]
      summary: Remove a plugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: pluginId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Plugin removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /servers/{id}/subdomains:
    get:
      operationId: listServerSubdomains
      tags: [servers]
      summary: List subdomains for a server
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subdomains list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subdomain"
    post:
      operationId: createServerSubdomain
      tags: [servers]
      summary: Create a subdomain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubdomainRequest"
      responses:
        "201":
          description: Subdomain created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subdomain"

  /servers/{id}/subdomains/{subId}:
    delete:
      operationId: deleteServerSubdomain
      tags: [servers]
      summary: Delete a subdomain
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: subId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Subdomain deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LoginRequest:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      required:
        - login
        - password

    AuthUser:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - role
        - createdAt

    UpdateProfileRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    Server:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [starting, running, stopping, stopped, crashed]
        version:
          type: string
        port:
          type: number
        memory:
          type: number
        disk:
          type: number
        nodeId:
          type: string
        userId:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        playerCount:
          type: number
        maxPlayers:
          type: number
        javaVersion:
          type: string
        serverType:
          type: string
          enum: [vanilla, paper, spigot, forge, fabric, bungeecord]
      required:
        - id
        - name
        - status
        - version
        - port
        - memory
        - disk
        - nodeId
        - userId
        - createdAt
        - updatedAt
        - serverType

    CreateServerRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        port:
          type: number
        memory:
          type: number
        disk:
          type: number
        nodeId:
          type: string
        userId:
          type: string
        maxPlayers:
          type: number
        javaVersion:
          type: string
        serverType:
          type: string
          enum: [vanilla, paper, spigot, forge, fabric, bungeecord]
      required:
        - name
        - version
        - port
        - memory
        - disk
        - nodeId
        - userId
        - serverType

    PowerActionRequest:
      type: object
      properties:
        action:
          type: string
          enum: [start, stop, restart, kill]
      required:
        - action

    CommandRequest:
      type: object
      properties:
        command:
          type: string
      required:
        - command

    ServerStats:
      type: object
      properties:
        serverId:
          type: string
        cpuPercent:
          type: number
        memoryUsed:
          type: number
        memoryLimit:
          type: number
        diskUsed:
          type: number
        diskLimit:
          type: number
        networkRx:
          type: number
        networkTx:
          type: number
        uptime:
          type: number
        playerCount:
          type: number
      required:
        - serverId
        - cpuPercent
        - memoryUsed
        - memoryLimit
        - diskUsed
        - diskLimit
        - networkRx
        - networkTx
        - uptime
        - playerCount

    LogsResponse:
      type: object
      properties:
        serverId:
          type: string
        logs:
          type: array
          items:
            type: string
      required:
        - serverId
        - logs

    User:
      type: object
      properties:
        id:
          type: string
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, user]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
        - role
        - createdAt

    CreateUserRequest:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [admin, user]
      required:
        - username
        - email
        - password

    Node:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        fqdn:
          type: string
        port:
          type: number
        memory:
          type: number
        disk:
          type: number
        status:
          type: string
          enum: [online, offline, maintenance]
        location:
          type: string
        createdAt:
          type: string
          format: date-time
        serversCount:
          type: number
      required:
        - id
        - name
        - fqdn
        - port
        - memory
        - disk
        - status
        - createdAt

    CreateNodeRequest:
      type: object
      properties:
        name:
          type: string
        fqdn:
          type: string
        port:
          type: number
        memory:
          type: number
        disk:
          type: number
        location:
          type: string
      required:
        - name
        - fqdn
        - port
        - memory
        - disk

    UpdateServerRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        memory:
          type: number
        disk:
          type: number
        maxPlayers:
